<!DOCTYPE html>
<html lang="en-us"><head>
<script src="/vs/gameloader-helper.js"></script>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ragdoll Archers</title>
<link rel="stylesheet" href="style.css">
<body>
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas"></canvas>
</div>
<div id="loading-cover">
<div id="unity-loading-bar">
<div id="unity-logo"><img src="logo.jpeg"></div>
<div class="progress-spinner-container">
<div class="spinner-left"><img src="spinner.png"></div>
<div id="unity-progress-bar-empty">
<div id="unity-progress-bar-full"></div>
</div>
<div class="spinner-right"><img src="spinner.png"></div>
</div>
</div>
</div>
<script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/v111.loader.js";
    const config = {
      dataUrl: buildUrl + "/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
      frameworkUrl: buildUrl + "/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
      codeUrl: buildUrl + "/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ericetto",
      productName: "Ragdoll Archers",
      productVersion: "0.1",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }
    
    loadingCover.style.display = "";

    // Keep the browser build in a sandbox-friendly cheat configuration.  The
    // native game does not expose its C# save system to the page, so we use
    // SendMessage when the corresponding game objects are present and also
    // seed the common PlayerPrefs keys for new games.
    const cheatTargets = ["GameManager", "GameController", "PlayerData", "SaveManager", "Shop", "ArrowShop", "UIManager"];
    const cheatMethods = [
      ["SetMoney", 2147483647],
      ["SetCoins", 2147483647],
      ["SetGold", 2147483647],
      ["SetCurrency", 2147483647],
      ["UnlockAllArrows", ""],
      ["UnlockAllWeapons", ""],
      ["UnlockAll", ""]
    ];

    function seedCheatPrefs() {
      ["money", "coins", "gold", "currency", "Money", "Coins", "Gold"].forEach((key) => {
        try { localStorage.setItem(key, "2147483647"); } catch (_) {}
      });
      ["arrowsUnlocked", "allArrowsUnlocked", "unlockedArrows", "allWeaponsUnlocked"].forEach((key) => {
        try { localStorage.setItem(key, "true"); } catch (_) {}
      });
    }

    function applyCheats() {
      seedCheatPrefs();
      if (!window.unityInstance || !window.unityInstance.SendMessage) return;
      cheatTargets.forEach((target) => cheatMethods.forEach(([method, value]) => {
        try { window.unityInstance.SendMessage(target, method, value); } catch (_) {}
      }));
    }

    window.enableCheats = applyCheats;
    seedCheatPrefs();

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
        applyCheats();
        // Reapply after scene changes and purchases so the values remain
        // effectively unlimited during the session.
        window.setInterval(applyCheats, 1000);
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script>
</body></html>
